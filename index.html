<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consultancy CRM</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex">
<script>try{var t=localStorage.getItem("consultCRM.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f2f4f7; --surface:#fff; --surface2:#f6f8fa; --text:#111827; --muted:#6b7280; --border:#e3e7ed;
  --accent:#0f766e; --accent-ink:#fff; --accent-soft:#d5f5ef;
  --red:#dc2626; --red-soft:#fde8e8; --amber:#b45309; --amber-soft:#fdf0d9; --green:#15803d; --green-soft:#dcf5e3;
  --blue:#2563eb; --blue-soft:#e0eaff; --purple:#7c3aed; --purple-soft:#ede5ff; --gray-soft:#eef0f3;
  --wa:#16a34a; --shadow:0 1px 2px rgba(17,24,39,.05),0 2px 10px rgba(17,24,39,.05); --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#121b2c; --surface2:#0f1727; --text:#e5e9f0; --muted:#97a3b6; --border:#223049;
  --accent:#2dd4bf; --accent-ink:#04201d; --accent-soft:#123f3b;
  --red:#f87171; --red-soft:#3b1518; --amber:#fbbf24; --amber-soft:#3a2a0c; --green:#4ade80; --green-soft:#10301c;
  --blue:#60a5fa; --blue-soft:#132a4d; --purple:#a78bfa; --purple-soft:#2a1d4d; --gray-soft:#1c2638; --shadow:0 1px 2px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#121b2c; --surface2:#0f1727; --text:#e5e9f0; --muted:#97a3b6; --border:#223049;
  --accent:#2dd4bf; --accent-ink:#04201d; --accent-soft:#123f3b;
  --red:#f87171; --red-soft:#3b1518; --amber:#fbbf24; --amber-soft:#3a2a0c; --green:#4ade80; --green-soft:#10301c;
  --blue:#60a5fa; --blue-soft:#132a4d; --purple:#a78bfa; --purple-soft:#2a1d4d; --gray-soft:#1c2638; --shadow:0 1px 2px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
/* layout */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside.nav{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 16px;font-weight:700;line-height:1.2}
.brand img{width:34px;height:34px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:15px}
.nav button .n{margin-left:auto}
.nav button:hover{background:var(--surface2)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navfoot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--border);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.navfoot .who{display:flex;align-items:center;gap:6px;justify-content:space-between}
main{padding:24px 28px 100px;max-width:1100px;width:100%}
.mtop,.tabs{display:none}
/* basics */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted);margin-right:5px}
.dot.ok{background:var(--green)} .dot.err{background:var(--red)} .dot.busy{background:var(--amber)}
.n{background:var(--red);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 7px;font-weight:700}
.n.soft{background:var(--gray-soft);color:var(--muted)}
.head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:24px;margin:0;flex:1;min-width:160px;letter-spacing:-.01em}
.head .sub{color:var(--muted);font-size:14px;width:100%;margin-top:-6px}
.btn{border:1px solid var(--border);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--text);font-weight:500;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;font-weight:600}
.btn.danger{color:var(--red)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 11px;font-size:13.5px;min-height:34px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:inherit;font-weight:500}
.themebtn{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=search],input[type=number],input[type=password],input[type=url],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;min-height:42px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
label.f>span{font-weight:600;color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)} .hint{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{font-size:16px;margin:0 0 12px}
.empty{padding:22px;text-align:center;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.green{background:var(--green-soft);color:var(--green)}
.pill.blue{background:var(--blue-soft);color:var(--blue)} .pill.purple{background:var(--purple-soft);color:var(--purple)} .pill.gray{background:var(--gray-soft);color:var(--muted)}
.red{color:var(--red)} .amber{color:var(--amber)} .green{color:var(--green)}
/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;border-left:5px solid var(--border)}
.tile .big{font-size:26px;font-weight:700;line-height:1.1}
.tile .lbl{font-weight:600}
.tile .s{font-size:13px;color:var(--muted)}
.tile.red{border-left-color:var(--red)} .tile.red .big{color:var(--red)}
.tile.amber{border-left-color:var(--amber)} .tile.amber .big{color:var(--amber)}
.tile.green{border-left-color:var(--green)}
.tile.blue{border-left-color:var(--blue)}
/* quick add */
.quick{display:flex;gap:8px}
.quick input{font-size:16px;flex:1;min-width:0}
.qhint{font-size:13px;color:var(--muted);margin:6px 2px 0}
/* sections & list items */
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:18px;overflow:hidden}
.sec>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.sec>header h2{font-size:16px;margin:0;flex:1;display:flex;gap:8px;align-items:center}
.sec>header .linkbtn{font-size:14px}
.sub-h{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 16px 4px;background:var(--surface2);border-bottom:1px solid var(--border)}
.sub-h.red{color:var(--red)}
.item{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0;cursor:pointer}
.item .t{font-weight:600;word-break:break-word}
.item .m{font-size:13.5px;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap;margin-top:2px;align-items:center}
.item .m a{overflow-wrap:anywhere}
.item .btns{display:flex;gap:6px;flex:none;align-items:center}
.item.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.donebtn{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;padding:0}
.donebtn:hover{border-color:var(--green);color:var(--green)}
.donebtn.on{background:var(--green);border-color:var(--green);color:#fff}
.amt{font-weight:700;white-space:nowrap;text-align:right}
.amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:14px}
/* filters */
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar input[type=search]{flex:1;min-width:200px}
.bar select{width:auto}
.seg{display:inline-flex;background:var(--gray-soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
/* pipeline board */
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:8px;min-height:120px}
.col h4{margin:4px 6px 10px;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.bcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:6px;cursor:pointer;font-size:14px}
.bcard .s{color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:600}
/* client panel */
.drawer{position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(580px,100vw);background:var(--bg);border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{padding:16px 18px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.dh .r1{display:flex;gap:12px;align-items:center}
.dh h2{margin:0;font-size:19px;line-height:1.25}
.dh .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.db{padding:4px 14px 30px;overflow:auto;flex:1}
.db .sec{margin-top:14px}
.stages{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px}
.stages button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;font-weight:500}
.stages button.on{color:#fff;border-color:transparent;font-weight:700}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;padding:14px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word;white-space:pre-wrap}
.hist{list-style:none;padding:12px 16px;margin:0}
.hist li{border-left:2px solid var(--border);padding:0 0 12px 14px;position:relative;font-size:14px}
.hist li::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--muted)}
.hist li.whatsapp::before{background:var(--wa)} .hist li.stage::before{background:var(--accent)} .hist li.payment::before{background:var(--amber)}
.hist .when{font-size:12px;color:var(--muted)}
.hist .txt{white-space:pre-wrap;word-break:break-word}
.notebox{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.biztag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--bc);background:color-mix(in srgb,var(--bc) 13%,transparent);white-space:nowrap}
.bdot{width:9px;height:9px;border-radius:50%;background:var(--bc);display:inline-block;margin-right:5px}
.bizsel{margin:0 0 12px;font-weight:600;min-height:40px}
.bizsel-m{border:0;background:none;font-weight:700;padding:0;min-height:0;width:auto;max-width:100%;font-size:15px}
.tiles.four{grid-template-columns:repeat(4,1fr)}
.docrow{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px}
.docrow input{width:20px;height:20px;accent-color:var(--green);flex:none;margin:0}
.docrow span{flex:1} .docrow span.got{color:var(--muted);text-decoration:line-through}
.docrow small{color:var(--muted);font-size:12px;white-space:nowrap}
.progress{height:6px;background:var(--gray-soft)}
.progress span{display:block;height:100%;background:var(--green);transition:width .3s}
.maptable td,.maptable th{padding:6px 8px;font-size:13.5px}
.maptable select{min-height:34px;padding:4px 8px}
.shade{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:19;display:none}
.shade.on{display:block}
/* modal */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;padding:16px;background:rgba(10,15,25,.5)}
.modal.on{display:flex}
.modal .box{background:var(--surface);border-radius:18px;width:min(580px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .box h2{font-size:19px;margin:0 0 6px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.addgrid button{border:1px solid var(--border);background:var(--surface2);border-radius:14px;padding:16px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.addgrid button b{font-size:15px}
.addgrid button span{font-size:12.5px;color:var(--muted)}
.addgrid button i{font-style:normal;font-size:24px}
.addgrid button:hover{border-color:var(--accent)}
.detect{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px}
.preview{background:#e7f8ec;color:#0b3d1c;border-radius:12px;padding:10px 12px;white-space:pre-wrap;font-size:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);background:#111827;color:#fff;padding:11px 18px;border-radius:12px;z-index:40;font-size:14px;opacity:0;transition:all .2s;pointer-events:none;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translateX(-50%)}
.intro{border-left:5px solid var(--accent);margin-bottom:18px}
.intro ol{margin:6px 0 0;padding-left:20px}
.intro li{margin:4px 0}
.intro li.ok{color:var(--muted);text-decoration:line-through}
.login{max-width:420px;margin:7vh auto;padding:0 16px}
.switch{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
/* ===== phones ===== */
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside.nav{display:none}
  main{padding:16px 14px 110px}
  .mtop{display:flex;position:sticky;top:0;z-index:14;align-items:center;gap:8px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border)}
  .mtop .t{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mtop .t small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
  .iconbtn{border:1px solid var(--border);background:var(--surface2);border-radius:999px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;flex:none}
  .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:15;padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;border:0;background:none;padding:8px 0 8px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
  .tabs button .i{font-size:21px;line-height:1}
  .tabs button.active{color:var(--accent);font-weight:700}
  .tabs button.plus .i{background:var(--accent);color:var(--accent-ink);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-top:-20px;box-shadow:0 4px 14px rgba(15,118,110,.4)}
  .tabs .n{position:absolute;top:3px;left:54%;font-size:10px;padding:0 5px}
  .head h1{font-size:21px}
  .tiles{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .tiles.four{grid-template-columns:1fr 1fr}
  .tile{padding:10px;border-left-width:0;border-top:4px solid var(--border)}
  .tile.red{border-top-color:var(--red)} .tile.amber{border-top-color:var(--amber)} .tile.green{border-top-color:var(--green)} .tile.blue{border-top-color:var(--blue)}
  .tile .big{font-size:20px} .tile .lbl{font-size:13px} .tile .s{font-size:11.5px}
  .quick{flex-wrap:wrap} .quick input{flex-basis:100%} .quick .btn{flex:1}
  .item{flex-wrap:wrap;padding:12px 14px}
  .item .main{flex:1 1 calc(100% - 50px)}
  .item .btns{width:100%;padding-left:42px}
  .item .btns .btn{flex:1}
  .item.nodone .main{flex:1 1 0}
  .item .btns{order:3}
  .item.nodone .btns{padding-left:50px}
  .tile .big{font-size:17px}
  .modal{align-items:flex-end;padding:0}
  .modal .box{border-radius:20px 20px 0 0;max-height:94vh;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .mfoot .btn{flex:1}
  .row2{grid-template-columns:1fr}
  .row2.keep{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:100px 1fr}
  .hide-m{display:none !important}
  .toast{bottom:96px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="shade" id="shade"></div>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ===== CRM SETTINGS – edit this one line after Part C of the setup guide =====
   Paste your Apps Script Web app URL between the quotes. Then every computer and phone
   goes straight to the staff sign-in screen – nothing to set up on each device. */
window.CRM_CONFIG = { apiUrl: "" };
</script>
<script src="app.js"></script>
</body>
</html>
